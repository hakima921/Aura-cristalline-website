<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Cristalline-GC</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
<h1 class="gold">Gestion des Commandes</h1>
</header>

<section class="indicateurs my-4">
<div class="row g-3">

<div class="col-12 col-md-6 col-lg-3">
<div class="card h-100">
<div class="card-body">
<h5 class="card-title gold">Nombre de clients</h5>
<p class="card-text" id="customers-count">0</p>
</div></div></div>

<div class="col-12 col-md-6 col-lg-3">
<div class="card h-100">
<div class="card-body">
<h5 class="card-title gold">Nombre de produits</h5>
<p class="card-text" id="products-count">0</p>
</div></div></div>

<div class="col-12 col-md-6 col-lg-3">
<div class="card h-100">
<div class="card-body">
<h5 class="card-title gold">Nombre de commandes</h5>
<p class="card-text" id="orders-count">0</p>
</div></div></div>

<div class="col-12 col-md-6 col-lg-3">
<div class="card h-100">
<div class="card-body">
<h5 class="card-title gold">Montant total de commandes</h5>
<p class="card-text" id="total-amount">0</p>
</div></div></div>

  </div>
</section>

<section class="filters">
<div class="row g-3">

<div class="col-12 col-md-4">
<label for="search-name" class="form-label"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
  <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
</svg>Rechercher un client</label>
<input type="search" id="search-name" class="form-control" placeholder="Rechercher par nom...">
</div>

<div class="col-12 col-md-4">
<label for="status-filter" class="form-label">Statut</label>
<select id="status-filter" class="form-select">
<option value="">Tous les statuts</option>
<option value="Livree">Livree</option>
<option value="En attente">En attente</option>
<option value="Annulee">Annulee</option>
</select>
</div>

<div class=" col-12 col-md-4">
<label for="category-filter" class="form-label">Catégorie</label>
<select id="category-filter" class="form-select">
<option value="">Toutes les catégories</option>
<option value="Lustre">Lustre</option>
<option value="Veilleuse">Veilleuse</option>
<option value="Chandelier">Chandelier</option>
<option value="Lampe Circulaire">Lampe Circulaire</option>
</select>
</div>

</div>
</section>

<div id="error-container" class="alert alert-danger my-3 d-none" role="alert"></div>

<section class="my-4">
  <h2 class="gold">Liste des commandes</h2>
  <div id="orders-container" class="row g-3">
    <p class="text-white fw-bold my-4">Chargement des commandes en cours...</p>
  </div>
</section>

<footer >
 <p>&copy; 2026 Aura Cristalline - Tous droits réservés.</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="./js/app.js"></script>   
</body>
</html>
